<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft 服务器</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<style>
:root{
  --bg:#08090a; --bg2:#0e1012; --bg3:#141719;
  --line:#1e2226; --txt:#e8eaed; --muted:#8b9298;
  --accent:#7ee787; --danger:#ff7b72; --warn:#e3b341; --radius:14px; --nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);line-height:1.7;-webkit-font-smoothing:antialiased;
  font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.9em}
::selection{background:var(--accent);color:#000}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
section{scroll-margin-top:80px}

/* 导航 */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:100;
  background:rgba(8,9,10,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1160px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
.logo i{width:10px;height:10px;background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a{padding:8px 13px;border-radius:8px;font-size:14px;color:var(--muted);transition:.2s;white-space:nowrap}
.nav-links a:hover{color:var(--txt);background:var(--bg3)}
.nav-links a.active{color:var(--accent)}
.nav-links a.cta{border:1px solid var(--line);color:var(--txt);margin-left:6px}
.nav-links a.cta:hover{border-color:var(--accent);color:var(--accent)}
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:4px}
.burger span{width:16px;height:1.5px;background:var(--txt)}

/* 首页 */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:calc(var(--nav) + 60px) 0 80px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;filter:saturate(.7)}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(900px 500px at 20% 20%,rgba(126,231,135,.10),transparent 60%),
             linear-gradient(180deg,rgba(8,9,10,.55),rgba(8,9,10,.92) 70%,var(--bg))}
.hero-in{position:relative;z-index:2}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);
  border:1px solid var(--line);background:var(--bg2);padding:6px 14px;border-radius:999px;margin-bottom:26px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dot.off{background:#e5534b}
h1{font-size:clamp(38px,7vw,74px);line-height:1.1;font-weight:800;letter-spacing:-1.5px}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:clamp(15px,2vw,18px);max-width:600px;margin:22px 0 34px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:10px;
  font-size:14.5px;font-weight:600;border:1px solid var(--line);background:var(--bg2);cursor:pointer;transition:.2s;color:var(--txt);font-family:inherit}
.btn:hover{border-color:#33393f;transform:translateY(-2px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:#06210c;border-color:var(--accent)}
.btn.primary:hover{box-shadow:0 8px 26px rgba(126,231,135,.22)}
.btn.sm{padding:9px 16px;font-size:13.5px}
.ip{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.stats{display:flex;flex-wrap:wrap;gap:44px;margin-top:60px;padding-top:32px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:26px;font-weight:700}
.stats span{font-size:13px;color:var(--muted)}

/* 通用 */
.sec{padding:100px 0}
.sec.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{margin-bottom:44px}
.label{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.label::before{content:"";width:22px;height:1px;background:var(--accent)}
h2{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.5px}
.sec-head p{color:var(--muted);margin-top:10px;font-size:15px}
.box{border:1px solid var(--line);border-radius:var(--radius);padding:26px;background:var(--bg2)}
.box h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.box p{font-size:14px;color:var(--muted)}
.note{margin-top:16px;font-size:13px;color:var(--muted)}
.note a{color:var(--accent);border-bottom:1px dashed rgba(126,231,135,.4)}
.side-note{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:#6d757b}

/* 画廊 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2);cursor:pointer;transition:.25s}
.card:hover{border-color:#2e343a;transform:translateY(-4px)}
.thumb{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#15191c,#0c0f11);overflow:hidden}
.thumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2f363c;font-size:13px;letter-spacing:2px}
.thumb img{position:relative;width:100%;height:100%;object-fit:cover;transition:.5s}
.card:hover .thumb img{transform:scale(1.06)}
.cap{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cap h3{font-size:15px;font-weight:600}
.cap p{font-size:12.5px;color:var(--muted)}
.arrow{color:var(--muted);transition:.2s}
.card:hover .arrow{color:var(--accent);transform:translateX(3px)}

/* 下载 */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;font-size:13px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);color:var(--muted);cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{color:var(--txt)}
.chip.on{background:var(--accent);color:#06210c;border-color:var(--accent);font-weight:600}
.list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2)}
.row{display:flex;align-items:center;gap:18px;padding:20px 22px;border-bottom:1px solid var(--line);transition:.2s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.ico{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--accent)}
.info{flex:1;min-width:0}
.info h3{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:5px}
.info p{font-size:13px;color:var(--muted);margin:3px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#6d757b;font-family:ui-monospace,monospace}
.empty{padding:50px;text-align:center;color:var(--muted);font-size:14px}

/* 规则 */
.rules-top{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--bg2);padding:5px 12px;border-radius:999px}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.rule-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg2);padding:24px;transition:.25s}
.rule-card:hover{border-color:#2e343a;transform:translateY(-3px)}
.rule-card h3{font-size:16px;display:flex;align-items:center;gap:10px}
.rule-card .rd{font-size:12.5px;color:#6d757b;margin:2px 0 16px}
.rule-list{display:grid;gap:11px;counter-reset:r}
.rule-list li{list-style:none;display:flex;gap:12px;font-size:13.5px;color:var(--muted);line-height:1.65}
.rule-list li::before{counter-increment:r;content:counter(r);flex:none;width:20px;height:20px;margin-top:3px;
  border-radius:6px;background:var(--bg3);border:1px solid var(--line);color:var(--accent);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace}
.table-wrap{overflow-x:auto;margin-top:14px}
.punish{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.punish th{text-align:left;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:#6d757b;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
.punish td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
.punish tr:last-child td{border-bottom:none}
.punish td:first-child{color:var(--txt)}
.punish tbody tr:hover{background:var(--bg3)}
.lv{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;border:1px solid;white-space:nowrap}
.lv.warn{color:var(--warn);border-color:rgba(227,179,65,.35);background:rgba(227,179,65,.08)}
.lv.ban{color:var(--danger);border-color:rgba(255,123,114,.35);background:rgba(255,123,114,.08)}

/* 白名单 */
.wl{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;align-items:start}
.rules{display:grid;gap:11px;margin-top:14px}
.rule{display:flex;gap:12px;font-size:13.5px;color:var(--muted);line-height:1.65}
.rule b{flex:none;width:20px;height:20px;margin-top:3px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center}
.rule a{color:var(--accent);border-bottom:1px dashed rgba(126,231,135,.4)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field{grid-column:span 2;margin-bottom:16px}
.field.half{grid-column:span 1}
.field>label{display:block;font-size:13.5px;font-weight:500;margin-bottom:7px}
.req{color:var(--accent)}
.opt-tag{font-size:11px;color:#6d757b;font-weight:400}
.counter{float:right;font-size:11.5px;color:#6d757b;font-family:ui-monospace,monospace}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--txt);font:inherit;font-size:14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(126,231,135,.12)}
textarea{min-height:104px;resize:vertical;line-height:1.6}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.hint{font-size:12px;color:#6d757b;margin-top:6px}
.err{font-size:12px;color:var(--danger);margin-top:6px;display:none}
.field.bad input,.field.bad select,.field.bad textarea{border-color:#e5534b}
.field.bad .err{display:block}

/* UUID 自动查询状态行（独立命名空间，避免与结果图标样式冲突） */
.lookup-line{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:18px;flex-wrap:wrap}
.lookup-msg{font-size:12px;line-height:1.5;display:none;align-items:center;gap:7px;font-weight:400}
.lookup-msg.show{display:inline-flex}
.lookup-msg.is-ok{color:var(--accent)}
.lookup-msg.is-bad{color:var(--warn)}
.lookup-msg.is-load{color:var(--muted)}
.lookup-retry{display:none;background:none;border:none;padding:0;font:inherit;font-size:12px;
  color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lookup-retry.show{display:inline}
.spin{width:11px;height:11px;flex:none;border:2px solid rgba(139,146,152,.25);border-top-color:var(--muted);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.actions .side{font-size:12px;color:#6d757b}
.agree-note{margin-top:14px;font-size:12.5px;color:#6d757b}
.agree-note a{color:var(--accent);border-bottom:1px dashed rgba(126,231,135,.4)}
.hp{position:absolute!important;left:-9999px;opacity:0;height:0}
.done{display:none;text-align:center;padding:26px 8px}
.done.show{display:block}
.done-icon{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.done.bad .done-icon{border-color:var(--danger);color:var(--danger)}
.done h3{font-size:19px;margin-bottom:8px}
.done p{font-size:14px;color:var(--muted);max-width:430px;margin:0 auto 20px}
.preview{display:none;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;
  font-family:ui-monospace,monospace;font-size:12.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.preview.show{display:block}
.done-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* 白名单额外操作按钮 */
.wl-extra{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.wl-extra a.btn{font-size:13.5px}

/* 关于 / 页脚 */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.steps{margin-top:16px;display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;font-size:14px;color:var(--muted)}
.step b{flex:none;width:22px;height:22px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);color:var(--accent);font-size:12px;display:flex;align-items:center;justify-content:center}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--muted);font-size:13px}
.foot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}

/* 灯箱 / 提示 */
.lb{position:fixed;inset:0;z-index:200;background:rgba(4,5,6,.95);display:none;align-items:center;justify-content:center;padding:70px 20px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:10px;border:1px solid var(--line)}
.lb-cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:14px;color:var(--muted)}
.lb-cap b{color:var(--txt);display:block;font-size:16px}
.lb button{position:absolute;background:rgba(20,23,25,.8);border:1px solid var(--line);color:var(--txt);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;transition:.2s}
.lb button:hover{border-color:var(--accent);color:var(--accent)}
.lb .close{top:20px;right:20px}
.lb .prev{left:20px;top:50%;transform:translateY(-50%)}
.lb .next{right:20px;top:55%;transform:translateY(-50%)}
.lb .next{top:50%}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:300;background:var(--accent);color:#06210c;
  font-weight:600;font-size:14px;padding:11px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:.28s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.reveal{opacity:0;transform:translateY(18px);transition:.6s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:900px){ .wl{grid-template-columns:1fr} }
@media(max-width:860px){
  .burger{display:flex}
  .nav-links{position:fixed;top:var(--nav);left:0;right:0;display:none;flex-direction:column;align-items:stretch;
    background:rgba(8,9,10,.98);border-bottom:1px solid var(--line);padding:14px 24px 22px;gap:4px}
  .nav-links.open{display:flex}
  .nav-links a{padding:12px 14px}
  .nav-links a.cta{margin-left:0}
  .sec{padding:70px 0}
  .row{flex-wrap:wrap}
  .dl{width:100%}.dl .btn{width:100%}
  .stats{gap:28px}
  .form-grid{grid-template-columns:1fr}
  .field.half{grid-column:span 2}
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-in">
    <a href="#home" class="logo"><i></i><span id="logoName"></span></a>
    <nav class="nav-links" id="menu"></nav>
    <button class="burger" id="burger" aria-label="menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section id="home" class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="wrap hero-in">
    <div class="tag"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
    <h1 id="heroTitle"></h1>
    <p class="sub" id="slogan"></p>
    <div class="btns">
      <button class="btn primary" id="copyIp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span id="copyIpText"></span>
      </button>
      <a class="btn" id="heroBtn2"></a>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<section id="gallery" class="sec">
  <div class="wrap">
    <div class="sec-head reveal"><div class="label" id="gLabel"></div><h2 id="gTitle"></h2><p id="gDesc"></p></div>
    <div class="grid" id="galleryGrid"></div>
  </div>
</section>

<section id="downloads" class="sec alt">
  <div class="wrap">
    <div class="sec-head reveal"><div class="label" id="dLabel"></div><h2 id="dTitle"></h2><p id="dDesc"></p></div>
    <div class="tools reveal">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b9298" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search">
      </label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="list reveal" id="fileList"></div>
    <p class="note" id="dNote"></p>
  </div>
</section>

<section id="rules" class="sec">
  <div class="wrap">
    <div class="sec-head reveal">
      <div class="label" id="rLabel"></div><h2 id="rTitle"></h2><p id="rDesc"></p>
      <div class="rules-top" id="rPills"></div>
    </div>
    <div class="rule-grid" id="ruleGrid"></div>
    <div class="box reveal" style="margin-top:16px">
      <h3 id="rPunishTitle"></h3>
      <div class="table-wrap">
        <table class="punish"><thead id="rPunishHead"></thead><tbody id="rPunishBody"></tbody></table>
      </div>
      <p class="note" id="rAppeal"></p>
      <p class="side-note" id="rNote"></p>
    </div>
  </div>
</section>

<section id="whitelist" class="sec alt">
  <div class="wrap">
    <div class="sec-head reveal"><div class="label" id="wLabel"></div><h2 id="wTitle"></h2><p id="wDesc"></p></div>
    <div class="wl">
      <div class="box reveal">
        <h3 id="wRulesTitle"></h3>
        <div class="rules" id="wRules"></div>
        <div class="side-note" id="wSideNote"></div>
      </div>
      <div class="box reveal">
        <form id="wlForm" novalidate>
          <div class="form-grid" id="formFields"></div>
          <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="actions">
            <button type="submit" class="btn primary" id="wlSubmit"></button>
            <button type="button" class="btn sm" id="wlClear"></button>
            <span class="side" id="wlModeHint"></span>
          </div>
          <p class="agree-note" id="wlAgree"></p>
        </form>
        <div class="done" id="wlDone">
          <div class="done-icon" id="doneIcon">✓</div>
          <h3 id="doneTitle"></h3>
          <p id="doneDesc"></p>
          <pre class="preview" id="donePreview"></pre>
          <div class="done-btns">
            <button class="btn sm primary" id="doneCopy"></button>
            <button class="btn sm" id="doneAgain"></button>
          </div>
        </div>

async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ try{ const a=document.createElement("textarea"); a.value=text; a.style.position="fixed";
    a.style.opacity="0"; document.body.appendChild(a); a.select();
    const ok=document.execCommand("copy"); a.remove(); return ok; }catch(_){ return false; } }
}

  <tr><td>${esc(p.act)}</td>
    <td><span class="lv ${p.level}">${esc(p.a)}</span></td>
    <td><span class="lv ${p.level}">${esc(p.b)}</span></td>
    <td><span class="lv ban">${esc(p.c)}</span></td></tr>`).join("");
set("#rAppeal",R.appeal); set("#rNote",R.note);

/* --- 白名单：静态文案 --- */
const W=TEXT.whitelist, LK=FORM.uuidLookup;
set("#wLabel",W.label); set("#wTitle",W.title); set("#wDesc",W.desc);
set("#wRulesTitle",W.rulesTitle); set("#wSideNote",W.sideNote);
$("#wRules").innerHTML=W.rules.map((r,i)=>`<div class="rule"><b>${i+1}</b><span>${t(r)}</span></div>`).join("");
set("#wlSubmit",W.submitBtn); set("#wlClear",W.clearBtn);
set("#wlModeHint",W.modeHint); set("#wlAgree",W.agreeNote);
set("#doneCopy",W.doneCopyBtn); set("#doneAgain",W.doneAgainBtn);

/* --- 白名单：动态表单 --- */
$("#formFields").innerHTML = FORM.fields.map(f=>{
  const id="f_"+f.key;
  const req = f.required ? '<span class="req">*</span>' : `<span class="opt-tag">${esc(W.optionalTag)}</span>`;
  const counter=f.maxlength?`<span class="counter" id="c_${f.key}">0 / ${f.maxlength}</span>`:"";
  const label=`<label for="${id}">${t(f.label)} ${req}${counter}</label>`;
  const cls=f.mono?' class="mono"':'';
  let input;
  if(f.type==="textarea"){
    input=`<textarea id="${id}" name="${f.key}" placeholder="${esc(t(f.placeholder||""))}"${f.maxlength?` maxlength="${f.maxlength}"`:""}></textarea>`;
  }else{
    input=`<input id="${id}" name="${f.key}" type="${f.type||"text"}"${cls} placeholder="${esc(t(f.placeholder||""))}"${f.maxlength?` maxlength="${f.maxlength}"`:""} autocomplete="off" spellcheck="false">`;
    if(f.lookup && LK.enabled){
      input += `<div class="lookup-line"><span class="lookup-msg" id="lookupMsg"></span>`
             + `<button type="button" class="lookup-retry" id="lookupRetry">${esc(W.lookup.retry)}</button></div>`;
    }
  }
  return `<div class="field${f.half?" half":""}" data-k="${f.key}">${label}${input}${f.hint?`<div class="hint">${t(f.hint)}</div>`:""}<div class="err"></div></div>`;
}).join("");

const wlForm=$("#wlForm");
function fieldWrap(k){ return wlForm.querySelector(`.field[data-k="${k}"]`); }
function val(f){ const el=fieldWrap(f.key).querySelector("input,select,textarea"); return el?el.value.trim():""; }
function setErr(f,msg){ const w=fieldWrap(f.key);
  w.classList.toggle("bad",!!msg); w.querySelector(".err").textContent=msg||""; }
function validate(){
  let first=null;
  FORM.fields.forEach(f=>{
    const v=val(f); let msg="";
    if(f.required && !v) msg=t(W.msg.required,{field:t(f.label).replace(/<[^>]+>/g,"")});
    else if(v && f.pattern && !new RegExp(f.pattern).test(v)) msg=t(f.patternMsg||W.msg.pattern);
    setErr(f,msg); if(msg&&!first) first=f;
  });
  if(first){ const w=fieldWrap(first.key); w.scrollIntoView({behavior:"smooth",block:"center"});
    const el=w.querySelector("input,textarea"); if(el) setTimeout(()=>el.focus(),400); }
  return !first;
}
/* 字数统计 + 本地草稿 */
const DRAFT="mc_wl_draft_"+SITE.name;
function collect(){ const o={}; FORM.fields.forEach(f=>o[f.key]=val(f)); return o; }
function saveDraft(){ if(!FORM.saveDraft)return; try{localStorage.setItem(DRAFT,JSON.stringify(collect()));}catch(e){} }
function updateCounters(){
  FORM.fields.filter(f=>f.maxlength).forEach(f=>{
    const el=wlForm.querySelector(`#f_${f.key}`), c=wlForm.querySelector(`#c_${f.key}`);
    if(el&&c) c.textContent=`${el.value.length} / ${f.maxlength}`;
  });
}
function loadDraft(){
  if(!FORM.saveDraft)return;
  let d; try{ d=JSON.parse(localStorage.getItem(DRAFT)||"null"); }catch(e){ return; }
  if(!d)return;
  FORM.fields.forEach(f=>{ if(!(f.key in d))return;
    const el=fieldWrap(f.key).querySelector("input,textarea"); if(el) el.value=d[f.key]; });
  updateCounters();
  if(d[LK.uuidKey]) uuidTouched=true;   // 草稿里的 UUID 视为已存在，不自动覆盖
}
wlForm.addEventListener("input",()=>{updateCounters();saveDraft();});

/* ══════ UUID 自动查询 ══════ */
const UUID_RE   = /^[0-9a-fA-F]{32}$/;
const UUID_DASH = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
const normUuid = u => String(u||"").replace(/-/g,"").toLowerCase();
const validUuid = u => UUID_RE.test(String(u||"")) || UUID_DASH.test(String(u||""));
function fmtUuid(u){ const s=normUuid(u);
  return LK.format==="plain" ? s : `${s.slice(0,8)}-${s.slice(8,12)}-${s.slice(12,16)}-${s.slice(16,20)}-${s.slice(20)}`; }

const idField   = FORM.fields.find(f=>f.key===LK.idKey);
const uuidField = FORM.fields.find(f=>f.key===LK.uuidKey);
if(uuidField && !uuidField.pattern){
  uuidField.pattern = UUID_RE.source+"|"+UUID_DASH.source;
  uuidField.patternMsg = "UUID 格式不正确（32 位十六进制，可带连字符）";
}

/* 公共 API（均支持 CORS），按顺序降级 */
const PROVIDERS = [
  { name:"PlayerDB",
    url:n=>`https://playerdb.co/api/player/minecraft/${encodeURIComponent(n)}`,
    pick:j=> j?.data?.player?.raw_id ? {uuid:j.data.player.raw_id, name:j.data.player.username} : null },
  { name:"Ashcon",
    url:n=>`https://api.ashcon.app/mojang/v2/user/${encodeURIComponent(n)}`,
    pick:j=> j?.uuid ? {uuid:j.uuid, name:j.username} : null },
  { name:"Minetools",
    url:n=>`https://api.minetools.eu/uuid/${encodeURIComponent(n)}`,
    pick:j=> (j?.id && !j.error && UUID_RE.test(j.id)) ? {uuid:j.id, name:j.name} : null }
];
const uuidCache=new Map();
let lookupSeq=0, debounceTimer=null, lastResolved="", uuidTouched=false, autoFilled=false;

async function fetchJson(url, ms){
  const c=new AbortController(); const timer=setTimeout(()=>c.abort(), ms);
  try{
    const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
/* 状态行：kind = load / ok / bad / ""（清空） */
function lookupStatus(text, kind, retry){
  const m=$("#lookupMsg"), r=$("#lookupRetry"); if(!m) return;
  if(!text){ m.className="lookup-msg"; m.innerHTML=""; if(r) r.classList.remove("show"); return; }
  m.className="lookup-msg show is-"+kind;
  m.innerHTML = (kind==="load"?'<span class="spin"></span>':"") + esc(text);
  if(r) r.classList.toggle("show", !!retry);
}
function clearUuidIfAuto(){
  if(!autoFilled) return;
  const el=fieldWrap(uuidField.key).querySelector("input");
  el.value=""; autoFilled=false; uuidTouched=false; saveDraft();
}
async function runLookup(force){
  if(!LK.enabled || !uuidField) return;
  const name=val(idField);
  if(!name){ lookupStatus(""); clearUuidIfAuto(); return; }
  if(idField.pattern && !new RegExp(idField.pattern).test(name)){
    lookupStatus(t(W.lookup.invalid),"bad",false); return; }
  setErr(idField,"");
  if(!force && name.toLowerCase()===lastResolved) return;

  const uEl=fieldWrap(uuidField.key).querySelector("input");
  if(uuidTouched && !autoFilled && uEl.value && !LK.overwriteManual && !force) return;

  const seq=++lookupSeq, key=name.toLowerCase();
  let hit=uuidCache.get(key), cached=!!hit;
  if(!hit) lookupStatus(t(W.lookup.loading),"load",false);

  if(!hit){
    for(const p of PROVIDERS){
      try{
        const j=await fetchJson(p.url(name), LK.timeout);
        const r=p.pick(j);
        if(r && validUuid(r.uuid)){ hit={...r, provider:p.name}; uuidCache.set(key,hit); break; }
      }catch(e){ /* 换下一家 */ }
      if(seq!==lookupSeq) return;      // 已有更新的输入，丢弃本次结果
    }
  }
  if(seq!==lookupSeq) return;
  lastResolved=key;

  if(hit){
    if(!uuidTouched || autoFilled || LK.overwriteManual || force){
      uEl.value=fmtUuid(hit.uuid); autoFilled=true; setErr(uuidField,""); saveDraft();
      toast(t(TEXT.toast.uuidFound,{name:hit.name||name}));
    }
    const msg = SITE.premium ? W.lookup.ok : W.lookup.okOffline;
    lookupStatus(t(msg,{name:hit.name||name, provider:hit.provider}) + (cached?" "+W.lookup.cached:""), "ok", false);
  }else{
    lookupStatus(t(W.lookup.notFound),"bad",true);
  }
}
function scheduleLookup(){
  if(!LK.enabled || !LK.auto) return;
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(()=>runLookup(false), LK.debounce);
}
if(LK.enabled && uuidField){
  const idEl=fieldWrap(idField.key).querySelector("input");
  const uEl =fieldWrap(uuidField.key).querySelector("input");
  idEl.addEventListener("input",()=>{
    const key=val(idField).toLowerCase();
    if(key!==lastResolved){ clearUuidIfAuto(); lookupStatus(""); }
    scheduleLookup();
  });
  if(LK.lookupOnBlur) idEl.addEventListener("blur",()=>{ clearTimeout(debounceTimer); runLookup(false); });
  idEl.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(debounceTimer); runLookup(true); } });
  uEl.addEventListener("input",()=>{ uuidTouched=!!uEl.value; if(uuidTouched) autoFilled=false; });
  const retry=$("#lookupRetry"); if(retry) retry.onclick=()=>runLookup(true);
}
loadDraft();
$("#wlClear").onclick=()=>{ wlForm.reset(); FORM.fields.forEach(f=>setErr(f,""));
  lookupStatus(""); lastResolved=""; uuidTouched=false; autoFilled=false; lookupSeq++;
  clearTimeout(debounceTimer);
  try{localStorage.removeItem(DRAFT);}catch(e){} updateCounters(); toast(t(TEXT.toast.draftCleared)); };

/* --- 白名单：生成文本 + 复制（无任何网络提交） --- */
function newId(){ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${FORM.idPrefix}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`; }
function buildText(data,id){
  const lines=[t(W.previewTitle,{id}), `服务器：${SITE.name}（${SITE.ip}）`, ""];
  FORM.fields.forEach(f=>{ const v=data[f.key]; if(v) lines.push(`${t(f.label).replace(/<[^>]+>/g,"")}：${v}`); });
  const empty=FORM.fields.filter(f=>!data[f.key]).map(f=>t(f.label).replace(/<[^>]+>/g,""));
  if(empty.length) lines.push(`（未填写：${empty.join("、")}）`);
  lines.push("", `提交时间：${new Date().toLocaleString("zh-CN")}`);
  return lines.join("\n");
}
let lastText="";
function showDone(ok,payload){
  const cfg = ok ? W.success : W.error;
  $("#wlForm").style.display="none";
  const d=$("#wlDone"); d.classList.add("show"); d.classList.toggle("bad",!ok);
  $("#doneIcon").textContent = ok?"✓":"!";
  $("#doneTitle").textContent=t(cfg.title); $("#doneDesc").textContent=t(cfg.desc);
  lastText=payload||"";
  $("#donePreview").textContent=payload||"";
  $("#donePreview").classList.toggle("show", !!payload && FORM.showPreview);
  d.scrollIntoView({behavior:"smooth",block:"center"});
}
$("#doneCopy").onclick=async()=>toast(await copy(lastText)?t(TEXT.toast.formCopied):t(TEXT.toast.copyFail));
$("#doneAgain").onclick=()=>{ $("#wlDone").classList.remove("show"); $("#wlForm").style.display="";
  wlForm.reset(); FORM.fields.forEach(f=>setErr(f,"")); updateCounters(); lookupStatus("");
  lastResolved=""; uuidTouched=false; autoFilled=false;
  try{localStorage.removeItem(DRAFT);}catch(e){} wlForm.scrollIntoView({behavior:"smooth",block:"center"}); };

wlForm.addEventListener("submit", async e=>{
  e.preventDefault();
  if(wlForm.querySelector('[name="_gotcha"]').value) return;   // 蜜罐
  if(!validate()) return;
  const btn=$("#wlSubmit"); btn.disabled=true; btn.textContent=t(W.submitting);
  const text=buildText(collect(), newId());
  const ok=await copy(text);
  btn.disabled=false; btn.innerHTML=t(W.submitBtn);
  if(ok){ try{localStorage.removeItem(DRAFT);}catch(e){} }
  showDone(ok,text);
});

/* ★ 新增：白名单区域后方跳转按钮渲染 */
(function renderWhitelistExtraButton(){
  const cfg = SITE.whitelistExtraButton;
  if(!cfg || !cfg.enable) {
    const wrap = $("#wlExtraBtnWrap");
    if(wrap) wrap.style.display = "none";
    return;
  }
  const wrap = $("#wlExtraBtnWrap");
  const btn = $("#wlExtraBtn");
  if(!wrap || !btn) return;
  btn.textContent = cfg.text;
  btn.href = cfg.href;
  if(cfg.target) btn.target = cfg.target;
  if(cfg.target === "_blank") btn.rel = "noopener noreferrer";
  // 如果 href 以 # 开头，添加平滑滚动
  if(cfg.href.startsWith("#")) {
    btn.addEventListener("click", (e) => {
      const target = document.querySelector(cfg.href);
      if(target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: "smooth" });
      }
    });
  }
})();

/* --- 关于 / 页脚 --- */
set("#aLabel",TEXT.about.label); set("#aTitle",TEXT.about.title); set("#aDesc",TEXT.about.desc);
set("#aStepsTitle",TEXT.about.stepsTitle);
$("#features").innerHTML=FEATURES.map(f=>`<div class="box"><h3>${f.icon} ${esc(f.title)}</h3><p>${esc(f.desc)}</p></div>`).join("");
$("#aSteps").innerHTML=TEXT.about.steps.map((s,i)=>`<div class="step"><b>${i+1}</b><span>${t(s)}</span></div>`).join("");
set("#footL",TEXT.footer.left); set("#footR",TEXT.footer.right);

/* --- 交互杂项 --- */
$("#burger").onclick=()=>$("#menu").classList.toggle("open");
$("#menu").onclick=e=>{ if(e.target.tagName==="A") $("#menu").classList.remove("open"); };
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);} }),{threshold:.1});
document.querySelectorAll(".reveal").forEach((el,i)=>{ el.style.transitionDelay=(i%6*40)+"ms"; io.observe(el); });
const links=[...document.querySelectorAll('.nav-links a[href^="#"]')];
const spy=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting)
  links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id)); }),
  {rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section[id]").forEach(s=>spy.observe(s));

/* --- 在线状态 --- */
if(SITE.status){
  fetch("https://api.mcsrvstat.us/3/"+encodeURIComponent(SITE.ip))
    .then(r=>r.json()).then(d=>{
      $("#statusDot").className="dot "+(d.online?"on":"off");
      $("#statusText").textContent = d.online
        ? t(TEXT.hero.badge.online,{online:d.players?.online??0,max:d.players?.max??"?"})
        : t(TEXT.hero.badge.offline);
    }).catch(()=>{ $("#statusText").textContent=t(TEXT.hero.badge.fallback); });
}else{ $("#statusText").textContent=t(TEXT.hero.badge.fallback); }
</script>
